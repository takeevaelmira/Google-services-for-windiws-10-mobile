<!DOCTYPE html PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN" "http://w3.org">
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Google Переводчик - Windows 10 Mobile</title>
    <style type="text/css">
        body {
            background-color: #121212;
            color: #e8eaed;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 16px;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #8ab4f8;
            text-decoration: none;
            font-size: 14px;
        }
        
        .app-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        .app-icon-large {
            width: 72px;
            height: 72px;
            border-radius: 16px;
            background-position: center;
            background-repeat: no-repeat;
            background-size: contain;
            margin-right: 16px;
            flex-shrink: 0;
        }
        .app-title-group {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .app-title {
            font-size: 22px;
            font-weight: 600;
            color: #e8eaed;
            margin: 0 0 4px 0;
        }
        .app-version {
            font-size: 13px;
            font-weight: 300;
            color: #9aa0a6;
        }

        .download-button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            background-color: #8ab4f8;
            color: #202124;
            font-weight: 600;
            padding: 14px;
            border-radius: 28px;
            text-decoration: none;
            font-size: 16px;
            margin-bottom: 24px;
        }
        .download-button:active {
            background-color: #669df6;
        }

        /* Контейнер горизонтальной галереи */
        .screenshots-scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            margin-bottom: 24px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .screenshot-item {
            display: inline-block;
            width: 200px;
            height: 355px;
            margin-right: 12px;
            vertical-align: top;
            border-radius: 12px;
            border: 1px solid #3c4043;
            object-fit: cover;
        }
        .screenshot-item:last-child {
            margin-right: 0;
        }

        .app-desc {
            font-size: 15px;
            line-height: 1.5;
            color: #e8eaed;
        }
    </style>
</head>
<body>

    <a href="./" class="back-link">&#8592; Назад к списку приложений</a>

    <div class="app-header">
        <div class="app-icon-large" style="background-image: url('https://raw.githubusercontent.com/takeevaelmira/Google-services-for-windows-10-mobile/refs/heads/main/Google_Translate_icon.png');"></div>
        <div class="app-title-group">
            <h1 class="app-title">Google Переводчик</h1>
            <div class="app-version">Версия 1.1.0</div>
        </div>
    </div>

    <a href="https://raw.githubusercontent.com/takeevaelmira/Google-services-for-windows-10-mobile/main/Google%20Translate_1.1.0.0_arm_Debug.appxbundle" class="download-button" download>Скачать</a>

    <!-- Горизонтальная прокрутка скриншотов влево и вправо -->
    <div class="screenshots-scroll-container">
        <img src="https://raw.githubusercontent.com/takeevaelmira/Google-services-for-windows-10-mobile/refs/heads/main/Google-translate-screenshot-1.jpg" class="screenshot-item" alt="Скриншот 1 Google Переводчик">
        <img src="https://raw.githubusercontent.com/takeevaelmira/Google-services-for-windows-10-mobile/refs/heads/main/Google-translate-screenshot-2.jpg" class="screenshot-item" alt="Скриншот 2 Google Переводчик">
    </div>

    <div class="app-desc">
        Приложение позволяет переводить любой текст, а также использовать камеру и микрофон для быстрого перевода.
    </div>

</body>
</html>
